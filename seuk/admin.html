<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>스윽 무통장입금 확인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
<style>
/* 스윽 웹 무통장입금 확인 (2026-11-27). 관리자 = perca seuk_admins 표에 있는 계정만 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,sans-serif;background:#0b0b0b;color:#ededed;padding:24px 16px;max-width:760px;margin:0 auto}
h1{font-size:22px;font-weight:800}.sub{color:#9b9b9b;font-size:13.5px;margin:6px 0 18px;line-height:1.6}
.card{background:#141414;border:1px solid #262626;border-radius:16px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:#9b9b9b;padding:8px 6px;border-bottom:1px solid #333}
td{padding:10px 6px;border-bottom:1px solid #222;vertical-align:middle}.m{color:#9b9b9b;font-size:12px}
.btn{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;background:#d8ff3e;color:#0b0b0b}
.btn.g{background:#2a2a2a;color:#bbb}.lg{display:grid;gap:8px;max-width:320px}
.btn.k{background:#fee500;color:#191919;padding:12px}.btn.w{background:#fff;color:#191919;padding:12px}
</style></head><body>
<h1>스윽 무통장입금 확인</h1>
<div class="sub">기업은행 043-133434-01-013(완벽한토익)에 <b>입금자명·금액</b>이 맞게 들어온 걸 보고 「입금 확인」을 누르면 그 계정에 이용권이 바로 열려요.</div>
<div class="card" id="box">불러오는 중…</div>
<script>
window.onerror=(m)=>{const b=document.getElementById("box");if(b)b.textContent="오류: "+m};
setTimeout(()=>{const b=document.getElementById("box");if(b&&b.textContent.trim()==="불러오는 중…")b.innerHTML="오래 걸리고 있어요. 새로고침해 보시고, 계속 이러면 사파리·크롬 같은 일반 브라우저로 열어 주세요."},12000);
const sb=supabase.createClient('https://rdocmjqemozmykgkfvkp.supabase.co','sb_publishable_UCqT5rdfWMhd3o-Yx5n4JQ_COQ6IB4e',{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>Number(n).toLocaleString('ko-KR')+'원';
async function login(p){await sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+'/seuk/admin.html'}})}
async function load(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$('#box').innerHTML='<div class="lg"><p class="m">관리자 계정으로 로그인해 주세요.</p><button class="btn k" id="lk">카카오로 로그인</button><button class="btn w" id="lgg">구글로 로그인</button></div>';
  $('#lk').onclick=()=>login('kakao');$('#lgg').onclick=()=>login('google');return}
 const {data:me}=await sb.rpc('seuk_whoami');
 if(!me||!me.admin){$('#box').innerHTML=`<p>아직 관리자로 등록되지 않은 계정이에요.</p><p class="m" style="margin-top:8px">아래 번호를 텔레그램으로 보내 주시면 등록해 드려요.<br><b style="color:#d8ff3e">${esc(me&&me.uid)}</b></p><button class="btn g" style="margin-top:12px" id="lo">다른 계정으로</button>`;
  $('#lo').onclick=async()=>{await sb.auth.signOut();load()};return}
 const {data,error}=await sb.rpc('web_order_bank_list');
 if(error||data.error){$('#box').textContent='목록을 못 읽었어요: '+(error?error.message:data.error);return}
 $('#box').innerHTML=data.length?`<table><thead><tr><th>신청</th><th>입금자명</th><th>금액</th><th>이용권</th><th></th></tr></thead><tbody>${data.map(o=>{const t=new Date(new Date(o.created_at).getTime()+9*3600e3).toISOString().slice(5,16).replace('T',' ');
  return `<tr><td>${t}</td><td><b>${esc(o.depositor)}</b><div class="m">${esc(o.nickname||'')}</div></td><td>${won(o.amount)}</td><td class="m">${esc(o.order_name)}</td>
  <td style="white-space:nowrap"><button class="btn" data-ok="${o.order_no}">입금 확인</button> <button class="btn g" data-no="${o.order_no}">취소</button></td></tr>`}).join('')}</tbody></table>`:'<p class="m">대기 중인 신청 없음</p>';
 document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{const o=data.find(x=>x.order_no==b.dataset.ok);if(!confirm(`${o.depositor} ${won(o.amount)} 입금 확인했나요? 누르면 바로 이용권이 열려요.`))return;
  b.disabled=true;const {data:r,error:e}=await sb.rpc('web_order_bank_confirm',{p_order_no:o.order_no});
  if(e||(r&&r.error)||(r&&r.ok===false)){alert('처리 못 함: '+(e?e.message:(r.error||'')));b.disabled=false;return}alert('이용권을 열었어요.');load()});
 document.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{if(!confirm('입금하지 않은 신청을 취소할까요?'))return;
  const {error:e}=await sb.rpc('web_order_bank_cancel',{p_order_no:b.dataset.no});if(e){alert(e.message);return}load()});
}
// 주의: onAuthStateChange 안에서 바로 supabase 호출을 기다리면 멈춘다(supabase-js 잠금) → 한 박자 늦춰 부른다
let busyLoad=false;const run=()=>{if(busyLoad)return;busyLoad=true;load().catch(e=>{$('#box').textContent='오류: '+(e&&e.message)}).finally(()=>busyLoad=false)};
sb.auth.onAuthStateChange(()=>setTimeout(run,0));run();
</script></body></html>
