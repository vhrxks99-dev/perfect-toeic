<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 실패 · 완벽한토익 데일리 RC</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;word-break:keep-all}
:root{--ink:#191f28;--sub:#6b7684;--bg:#f6f4ef}
body{font-family:Pretendard,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);letter-spacing:-.3px;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:56px 20px 48px}
.card{background:#fff;border-radius:22px;padding:28px 22px;box-shadow:0 6px 24px rgba(15,31,77,.08);margin-bottom:14px;text-align:center}
.ico{width:64px;height:64px;border-radius:50%;background:#fdecec;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}.ico svg{width:34px;height:34px}
h1{font-size:24px;font-weight:800;line-height:1.35}
.lead{font-size:16px;color:var(--sub);line-height:1.6;margin-top:8px}
.why{background:var(--bg);border-radius:14px;padding:14px;font-size:14px;color:#4e5968;line-height:1.6;margin-top:18px;text-align:left}
.why small{display:block;color:#a3aab3;font-size:12px;margin-top:4px}
.btn{display:block;text-align:center;border:0;font-family:inherit;font-weight:800;font-size:17px;border-radius:14px;padding:16px;text-decoration:none;margin-top:10px}
.btn.dk{background:var(--ink);color:#fff;margin-top:20px}.btn.ky{background:#fee500;color:#191f28}
.note{font-size:13px;color:var(--sub);line-height:1.6;text-align:center}
</style></head><body><div class="wrap">
<div class="card">
 <div class="ico"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke="#e5484d" stroke-width="3" stroke-linecap="round"/></svg></div>
 <h1 id="t">결제가 되지 않았어요</h1>
 <p class="lead" id="l">돈은 빠져나가지 않았어요.</p>
 <div class="why" id="why" hidden></div>
 <a class="btn dk" href="../rc/#buy">다시 결제하기</a>
 <a class="btn ky" href="https://pf.kakao.com/_JCLYG/chat" target="_blank" rel="noopener">카톡으로 물어보기</a>
</div>
<p class="note">같은 문제가 계속 나오면 다른 결제수단으로 해 보시거나 카톡으로 알려 주세요.</p>
</div>
<script>
const q=new URLSearchParams(location.search);
const code=q.get('code')||'',msg=q.get('m')||q.get('message')||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 자주 나오는 것만 우리 말로
const K={PAY_PROCESS_CANCELED:['결제를 취소하셨어요','결제창을 닫아서 멈췄어요. 돈은 빠져나가지 않았어요.'],
 PAY_PROCESS_ABORTED:['결제가 중간에 멈췄어요','카드사 연결이 끊겼어요. 잠시 뒤 다시 해 주세요.'],
 REJECT_CARD_COMPANY:['카드사에서 거절했어요','한도·카드 정보를 확인하시거나 다른 카드로 해 주세요.'],
 INVALID_CARD_EXPIRATION:['카드 유효기간을 확인해 주세요','유효기간이 지났거나 잘못 들어갔어요.'],
 EXCEED_MAX_AMOUNT:['카드 한도를 넘었어요','다른 카드로 해 주세요.']};
if(K[code]){document.getElementById('t').textContent=K[code][0];document.getElementById('l').textContent=K[code][1]}
if(msg||code){const w=document.getElementById('why');w.hidden=false;w.innerHTML=(msg?esc(msg):'알 수 없는 이유')+(code?`<small>오류 코드 ${esc(code)}</small>`:'')}
</script></body></html>
